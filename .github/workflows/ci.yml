name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Types (strict)
        run: mypy src scripts
      - name: Pure-math suite
        run: pytest -m "not perception and not sim and not hardware" --cov=robo_mimic --cov-report=term-missing

  perception:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # mediapipe dlopens GL at import on Linux and a bare runner has none:
      #   OSError: libGLESv2.so.2: cannot open shared object file
      # Package names have shifted across Ubuntu images, so try both and do not
      # fail the job on a name that no longer exists.
      - name: GL libraries mediapipe needs on a headless runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libegl1 \
            || sudo apt-get install -y --no-install-recommends \
               libgl1-mesa-glx libglib2.0-0 libegl1-mesa
          sudo apt-get install -y --no-install-recommends libgles2 \
            || sudo apt-get install -y --no-install-recommends libgles2-mesa \
            || echo "no libgles2 package under either name; continuing"
      - run: pip install -e ".[perception,dev]"
      - name: Fetch model + reference image (not committed)
        run: make assets
      - name: Rebuild the reference PNG and landmark fixture for THIS platform
        run: make fixtures
      # `golden` is excluded: it asserts bit-identity against a fixture generated
      # on macOS arm64. That has not been verified across OS/arch, so asserting it
      # on a Linux runner would be an untested claim. See the test's docstring.
      - name: Perception suite
        run: pytest -m "perception and not golden"
