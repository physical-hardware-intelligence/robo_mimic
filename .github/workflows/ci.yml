name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Types (strict)
        run: mypy src
      - name: Pure-math suite
        run: pytest -m "not perception and not sim and not hardware" --cov=mirror --cov-report=term-missing

  perception:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[perception,dev]"
      - name: Perception suite (tolerance-based -- mediapipe is not bit-reproducible)
        run: pytest -m perception
